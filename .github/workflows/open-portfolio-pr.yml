name: Open Portfolio PR

on:
  push:
    branches:
      - portfolio-v2
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft PR if one does not exist
        uses: actions/github-script@v7
        env:
          PR_BODY_PATH: .github/pr/portfolio-v2.md
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'portfolio-v2';
            const base = 'master';
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base
            });
            if (existing.data.length > 0) {
              core.info(`PR already exists: #${existing.data[0].number}`);
              return;
            }
            const body = fs.readFileSync(process.env.PR_BODY_PATH, 'utf8');
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: 'ZHA-185: Initialize portfolio backup and workspace',
              head,
              base,
              body,
              draft: true
            });
            core.info(`Created draft PR #${pr.data.number}: ${pr.data.html_url}`);
